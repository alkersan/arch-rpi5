[Distribution]
Distribution=arch
Architecture=arm64
RepositoryKeyCheck=yes
RepositoryKeyFetch=yes

[Output]
Format=disk
OutputDirectory=mkosi.output
SplitArtifacts=

[Build]
CacheDirectory=mkosi.cache

[Content]
Bootable=no
Bootloader=none

Locale=C.UTF-8
Timezone=UTC

Packages=
  archports-keyring
	base
	bash-completion
	efibootmgr
	efivar
	flashrom
	ghostty-terminfo
	htop
	less
	linux-rpi5
	linux-rpi5-headers
	lm_sensors
	micro
	mkinitcpio
	openssh
	pciutils
	rpi5-eeprom
	usbutils


Initrds=

RemoveFiles=
	/efi
	/init
