[Distribution]
Distribution=arch
Architecture=arm64
RepositoryKeyCheck=yes
RepositoryKeyFetch=yes

[Output]
Format=disk
OutputDirectory=mkosi.output
SplitArtifacts=

[Build]
CacheDirectory=mkosi.cache

[Content]
Bootable=no
Bootloader=none

Locale=C.UTF-8
Timezone=UTC

Packages=
  archlinux-keyring
  archports-keyring
  base
  base-devel
  bash-completion
  efibootmgr
  efivar
  flashrom
  ghostty-terminfo
  htop
  less
  linux-rpi5
  lm_sensors
  micro
  mkinitcpio
  openssh
  pciutils
  rpi5-eeprom
  systemd-ukify
  uboot-rpi5
  usbutils


Initrds=

RemoveFiles=
	/efi
	/init
