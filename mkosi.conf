[Distribution]
Distribution=arch
Architecture=arm64
RepositoryKeyCheck=yes
RepositoryKeyFetch=yes

[Output]
Format=disk
OutputDirectory=mkosi.output
SplitArtifacts=

[Build]
CacheDirectory=mkosi.cache

[Content]
Bootable=no
Bootloader=none

Locale=C.UTF-8
Timezone=UTC

Packages=
  archlinux-keyring
  archports-keyring
  base
  #base-devel
  mkinitcpio

  bash-completion
  efibootmgr
  efivar
  flashrom
  ghostty-terminfo
  htop
  less
  lm_sensors
  micro
  openssh
  pciutils
  rpi5-eeprom
  sudo
  usbutils


Initrds=

RemoveFiles=
  /efi
  /init
