[Distribution]
Distribution=arch
Architecture=arm64
RepositoryKeyCheck=yes
RepositoryKeyFetch=yes

[Output]
Format=disk
OutputDirectory=mkosi.output
SplitArtifacts=

[Build]
CacheDirectory=mkosi.cache

[Content]
Bootable=no
Bootloader=none

Locale=C.UTF-8
Timezone=UTC

Packages=
  archlinux-keyring
  archports-keyring

  base
  less
  mkinitcpio
  raspberrypi-utils
  rpi5-eeprom
  polkit


Initrds=

RemoveFiles=
  /efi
  /init
