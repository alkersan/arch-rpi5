name: build
run-name: ${{ github.event_name == 'schedule' && 'daily build & publish' || (inputs.publish && 'build & publish' || 'build') }}

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish
        type: boolean
        default: false

  schedule:
    - cron: "17 13 * * *"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-26.04-arm

    steps:
      - name: Checkout mkosi
        uses: actions/checkout@v7
        with:
          repository: alkersan/mkosi
          path: mkosi
          persist-credentials: false

      - name: Setup mkosi
        working-directory: mkosi
        run: |
          {
            ./bin/mkosi dependencies
            printf '%s\n' pacman-package-manager makepkg
          } | xargs -r -d '\n' sudo apt-get install -yqq --no-install-recommends
          
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_unconfined=0
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

          echo "$GITHUB_WORKSPACE/mkosi/bin" >> "$GITHUB_PATH"

      - name: Checkout src
        uses: actions/checkout@v7
        with:
          path: project
          persist-credentials: false

      - name: Build
        working-directory: project
        run: |
          mkosi build --profile "linux-rpi5,firstboot,growfs,ssh" \
            --output="arch-rpi5-$(date -u +%Y-%m-%d)" \
            --output-extension=img \
            --compress-output=xz \
            --checksum

      - name: Publish
        if: github.event_name == 'schedule' || inputs.publish
        working-directory: project
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL_S3: ${{ secrets.S3_ENDPOINT_URL }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
        run: |
          aws s3 cp mkosi.output/ "s3://${S3_BUCKET}/images/" \
            --recursive \
            --no-progress \
            --exclude "*" \
            --include "*.img.xz" \
            --include "*.SHA256SUMS"
          
          # Keep 7 recent images
          aws s3 ls "s3://${S3_BUCKET}/images/" |
            awk '$4 ~ /^arch-rpi5-[0-9]{4}-[0-9]{2}-[0-9]{2}\.img\.xz$/ {print $4}' |
            sort -r |
            tail -n +8 |
          while read -r image; do
            aws s3 rm "s3://${S3_BUCKET}/images/${image}"
            aws s3 rm "s3://${S3_BUCKET}/images/${image%.img.xz}.SHA256SUMS"
          done
          
          ./site/generate.sh
